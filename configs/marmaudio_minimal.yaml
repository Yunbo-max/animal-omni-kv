seed: 20250813
model:
  id: Qwen/Qwen2.5-Omni-3B
  thinker_only: true
  dtype: bfloat16
  target_sample_rate: 16000
scaling:
  confirm_model_id: Qwen/Qwen2.5-Omni-7B
  paired_core_subset_per_class: 50
  # Trigger 7B when any condition holds on the pre-registered validation subset.
  trigger_7b_if:
    full_accuracy_at_most: 0.25
    bootstrap_frequency_trend_not_positive: true
    oracle_recovery_fraction_at_most: 0.20
  # Quantized 7B is allowed for generation screening only, never as evidence
  # about KV gradients. Gradient experiments use BF16 with CPU offload.
  generation_checkpoint: Qwen/Qwen2.5-Omni-7B-AWQ
  gradient_checkpoint: Qwen/Qwen2.5-Omni-7B
dataset:
  manifest: data/manifests/marmaudio.csv
  labels: [Infant Cry, Phee, Seep, Trill, Tsik, Twitter]
  split_group: recording_id
  train_fraction: 0.70
  validation_fraction: 0.15
  # Keep all interventions of an event in the same split.
  event_id_column: event_id
audio:
  peak_normalize: false
  lowpass_cutoffs_hz: [1000, 2000, 4000, 6000, 8000]
  removed_bands_hz: [[0, 1000], [1000, 2000], [2000, 4000], [4000, 6000], [6000, 8000]]
  filter_order: 10
evaluation:
  prompt: "Listen to this common marmoset vocalization. Choose exactly one label from: Infant Cry, Phee, Seep, Trill, Tsik, Twitter. Answer with only the label."
  temperature: 0.0
  do_sample: false
  max_new_tokens: 8
  metrics: [accuracy, macro_f1]
  # Qwen outputs were empirically not invariant to variable-length batch
  # padding. All authoritative results therefore use one event per batch.
  batch_size: 1
kv:
  ranks: [1, 2, 4, 8, 16, 32]
  support_sizes: [1, 5, 10, 20]
  oracle_etas: [0.01, 0.03, 0.1, 0.3, 1.0]
  eligibility: full_correct_degraded_wrong
